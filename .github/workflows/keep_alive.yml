name: Keep Alive Render

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          # Replace the URL below with your actual Render backend URL once it's deployed
          curl -s https://login-intern-backend.onrender.com/ > /dev/null
